<!--
  Centralized config for the "linux" agent group.
  Apply on the manager:
    1. Create group: POST /groups {"group_id":"linux"} (or dashboard)
    2. Copy this file to /var/ossec/etc/shared/linux/agent.conf
    3. Assign agents (e.g. siem-host): PUT /agents/{id}/group/linux
    4. Restart manager or wait for agents to pull shared config

  Windows agents stay in "default" (deferred telemetry pass).
-->
<agent_config>

  <!-- Persistence-focused FIM (realtime). Baseline dirs stay in local ossec.conf. -->
  <syscheck>
    <directories realtime="yes" check_all="yes">/etc/crontab,/etc/cron.d,/etc/cron.daily,/etc/cron.hourly,/etc/cron.weekly,/etc/cron.monthly</directories>
    <directories realtime="yes" check_all="yes">/etc/systemd/system,/lib/systemd/system,/usr/lib/systemd/system</directories>
    <directories realtime="yes" check_all="yes">/etc/ssh,/etc/sudoers,/etc/sudoers.d</directories>
    <directories realtime="yes" check_all="yes">/etc/passwd,/etc/shadow,/etc/group,/etc/gshadow</directories>
    <directories realtime="yes" check_all="yes">/root/.ssh,/home/analyst/.ssh</directories>
  </syscheck>

  <!-- Auth, syslog, UFW, audit -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>
  <!-- ufw.log is already collected by the stock Pop agent ossec.conf -->
  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

  <!-- Pi-hole dnsmasq query log (host bind mount; see deploy/wazuh/pihole/) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/pihole/pihole.log</location>
  </localfile>

  <!-- Docker events on the SIEM host (manager, indexer, pihole, etc.) -->
  <wodle name="docker-listener">
    <disabled>no</disabled>
    <interval>10m</interval>
    <attempts>5</attempts>
    <run_on_start>yes</run_on_start>
  </wodle>

</agent_config>
